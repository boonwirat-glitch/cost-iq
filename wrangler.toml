# ตั้งค่า deploy ของ Cloudflare Worker (v_aifix 2026-08-08)
#
# ทำไมต้องมีไฟล์นี้: 2026-08-08 บุชลองรัน `npx wrangler deploy worker/…-v2.js`
# โดยไม่มีไฟล์นี้ → wrangler จะเดาชื่อ worker จากชื่อไฟล์เป็น
# "freshket-sense-ai-proxy-v2" ซึ่ง **คนละตัวกับของจริง** แล้วสร้าง worker ใหม่
# เปล่าๆ ที่ไม่มี API key ไม่มี cron ส่วนตัวจริงยังเป็นโค้ดเก่า
#
# deploy ด้วยคำสั่งเดียวจากรากรีโป:
#   npx wrangler deploy
#
# ⚠ secret ไม่ได้อยู่ในไฟล์นี้และไม่ควรอยู่ — มันเก็บบน worker อยู่แล้ว
# (GEMINI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY, SUPABASE_SERVICE_KEY,
#  SUPABASE_URL, GOOGLE_SA_CLIENT_EMAIL, GOOGLE_SA_PRIVATE_KEY,
#  GOOGLE_SHEETS_SPREADSHEET_ID — 3 ตัวหลัง v_keyexport 2026-08-16) การ deploy
# ทับ **ไม่ลบ secret** · ถ้าต้องตั้งใหม่ใช้
#   npx wrangler secret put <ชื่อ>

name = "freshket-sense-ai-proxy"
main = "worker/freshket-sense-ai-proxy-v2.js"
compatibility_date = "2026-08-08"

# ⚠⚠ ห้ามลบบรรทัดนี้ — บทเรียนราคาแพง 2026-08-14: GROQ_API_KEY กับ
# SUPABASE_SERVICE_KEY ถูกตั้งเป็น "text variable" บนหน้า dashboard (ไม่ใช่
# secret) และ `wrangler deploy` ค่าเริ่มต้นจะ **แทนที่ vars ทั้งชุด** ด้วยของใน
# ไฟล์นี้ → deploy ครั้งแรกจากเครื่องลบ key ทิ้งเงียบๆ pipeline ล่มทันที
# (กู้ด้วย `wrangler rollback 3cad20e5`) · keep_vars=true สั่งให้ deploy
# เก็บ vars ฝั่ง dashboard ไว้เสมอ — จะปลอดภัยถาวรต่อเมื่อย้าย 2 ตัวนั้น
# เป็น secret จริงด้วย `wrangler secret put` (ต้องมีค่า key — บุชถืออยู่)
keep_vars = true

# ⚠⚠ ต้องตรงกับที่ตั้งไว้จริงในหน้า Cloudflare (Settings → Triggers → Cron)
# ถ้าไฟล์นี้ประกาศไม่ตรง การ deploy จะ "เขียนทับ" ตารางเดิม แล้ว sweepPending
# ที่เป็นตัวขับ pipeline ของ Echo จะหยุดทำงานเงียบๆ — ตรวจก่อน deploy ครั้งแรกเสมอ
[triggers]
# v_queue (2026-08-12): ทุก 5 นาที เฉพาะเวลาทำงาน — **เวลาเป็น UTC ไม่ใช่เวลาไทย**
#   2-15 UTC = 09:00-22:55 น. ไทย (เผื่อ visit เย็นและการอัปโหลดหลังเลิกงาน)
#   = 168 รอบ/วัน · 1 รอบ = 1 ขั้นของ 1 session (เพดาน Free 50 subrequest)
#   → รับได้ ~84 การอัด/วัน = 2.4 เท่าของเป้าการบ้านรายไตรมาส (~35/วัน)
#
# ทำไมไม่ถี่กว่านี้: การลองใหม่ถูกคุมด้วย next_attempt_at ใน DB แล้ว ไม่ใช่ด้วย
# ความถี่ cron · ของเดิม */2 ทั้งวันคือตัวการที่เผาโควตา Groq จนไฟล์ดีถอดไม่ผ่าน
# ทำไมไม่ห่างกว่านี้: 30 นาทีจะเหลือเพดานแค่ ~13 การอัด/วัน ซึ่งต่ำกว่าเป้า
crons = ["*/5 2-15 * * *"]

# v_audior2 (2026-08-21): ถังส่วนตัวสำหรับไฟล์เสียง Echo
#
# ทำไมต้องถังใหม่ ไม่ใช้ freshket-data ที่มีอยู่: ถังนั้นเปิดสาธารณะ (มี public
# r2.dev URL ที่แอปดึง CSV) — ไฟล์เสียงเป็นบทสนทนาลูกค้าจริงพร้อมพิกัด GPS ของ rep
# เอาไปวางในถังสาธารณะไม่ได้เด็ดขาด · ถังนี้ไม่มี public URL เลย เข้าถึงได้ทาง
# binding จาก worker เท่านั้น
#
# ทำไมย้ายมา R2: Supabase คิดค่า "ขาออก" ทุกครั้งที่ worker ดึงไฟล์ไปถอดเสียง
# (71 จาก 88 request ใน 24 ชม. เป็น cache HIT = ถูกนับเต็มขนาดไฟล์ทุกครั้ง)
# ทำให้เกินโควตา 327% · R2 ไม่คิดค่าขาออก ⇒ ยอดฝั่ง Supabase เหลือ 0
[[r2_buckets]]
binding = "ECHO_AUDIO"
bucket_name = "freshket-echo-audio"

[vars]
# จำนวนวันที่เก็บไฟล์เสียงไว้ก่อนให้ cron กวาดลบ (0 = ไม่ลบเลย)
# เก็บไว้เพื่อให้ย้อนกลับไปฟัง ลองโมเดลใหม่ และสร้างชุดทดสอบจากคลิปจริงได้
# v_retention7 (2026-08-17): บุชเคาะ 30→7 — bucket ciq-data ใช้ไป ~21% ของโควตา
# ฟรีแล้วจากแค่ 5 วัน pilot กลุ่มเล็ก การขยายทีมเต็มรูปแบบจะเกินโควตาแน่ที่ 30 วัน
# ⚠ keep_vars=true (ดูด้านบน) แปลว่าถ้ามีการตั้งค่านี้แยกไว้บน Cloudflare dashboard
# มาก่อน ค่าบน dashboard จะชนะไฟล์นี้ตอน deploy — ต้องเช็ค dashboard เองครั้งเดียว
# หลัง deploy ว่าอ่านได้ "7" จริง (ไม่ใช่แค่เชื่อไฟล์นี้)
AUDIO_RETENTION_DAYS = "7"

# v_skilllog (2026-08-17): จำนวนวันที่เก็บ echo_skill_observations/kam_skill_log
# ไว้ก่อนให้ cron กวาดลบ (0 = ไม่ลบเลย) — คนละธรรมชาติกับไฟล์เสียง (บันทึก
# coaching/skill trend ไม่ใช่เสียงดิบลูกค้า) จึงตั้งยาวกว่ามาก ครอบคลุมเกิน
# 4 ไตรมาสเผื่อดู skill trend ย้อนหลัง — ปรับได้ถ้าต้องการสั้น/ยาวกว่านี้
SKILL_LOG_RETENTION_DAYS = "400"
